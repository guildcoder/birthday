<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { opened: false, singing: false, ended: false, fx: [], scale: 1 };
  stageRef = React.createRef(); jawRef = React.createRef(); cavityRef = React.createRef(); mouthRef = React.createRef();
  fxId = 0;
  MELODY = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],[67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2.5],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3]];

  componentDidMount() {
    this.onResize = () => {
      const s = Math.min(1, (window.innerWidth - 24) / 760, (window.innerHeight - 110) / 640);
      this.setState({ scale: Math.max(0.35, s) });
    };
    this.onResize();
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    cancelAnimationFrame(this.raf);
    this.timers?.forEach(clearTimeout);
  }

  open = () => {
    if (this.state.opened) return;
    this.setState({ opened: true });
    this.ensureAudio();
    this.burstConfetti();
    this.sing(1.5);
  };
  replay = () => { this.ensureAudio(); this.sing(0.2); };

  ensureAudio() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const c = this.ctx;
      this.master = c.createGain(); this.master.gain.value = 0.55;
      const delay = c.createDelay(); delay.delayTime.value = 0.19;
      const fb = c.createGain(); fb.gain.value = 0.28;
      const wet = c.createGain(); wet.gain.value = 0.35;
      this.master.connect(c.destination);
      this.master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(c.destination);
    }
    this.ctx.resume();
  }

  voice(t, midi, d) {
    const c = this.ctx, f = 440 * Math.pow(2, (midi - 69) / 12);
    const env = c.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.32, t + 0.035);
    env.gain.setValueAtTime(0.32, t + d * 0.7);
    env.gain.linearRampToValueAtTime(0, t + d * 0.94);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(550, t);
    bp.frequency.exponentialRampToValueAtTime(1500, t + Math.min(0.18, d * 0.4));
    bp.frequency.exponentialRampToValueAtTime(700, t + d * 0.9);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    const lfo = c.createOscillator(); lfo.frequency.value = 6.2;
    const lfoGain = c.createGain();
    lfoGain.gain.setValueAtTime(f * 0.006, t);
    lfoGain.gain.linearRampToValueAtTime(f * 0.035, t + Math.max(0.15, d * 0.8));
    lfo.connect(lfoGain);
    [['sawtooth', 0], ['triangle', 9], ['square', -6]].forEach(([type, det], i) => {
      const o = c.createOscillator(); o.type = type; o.detune.value = det;
      o.frequency.setValueAtTime(f * 0.86, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.07);
      lfoGain.connect(o.frequency);
      const g = c.createGain(); g.gain.value = [0.5, 0.9, 0.18][i];
      o.connect(g); g.connect(bp);
      o.start(t); o.stop(t + d);
    });
    bp.connect(lp); lp.connect(env); env.connect(this.master);
    lfo.start(t); lfo.stop(t + d);
    this.bubble(t + 0.01, 0.12);
    if (d >= 1) this.bubble(t + d * 0.55, 0.08);
  }

  bubble(t, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    const base = 260 + Math.random() * 260;
    o.type = 'sine';
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 4, t + 0.06);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.1);
  }

  sing(lead) {
    if (this.state.singing) return;
    const c = this.ctx, beat = 0.44;
    let t = c.currentTime + lead;
    this.sched = this.MELODY.map(([m, b]) => { const n = { m, s: t, e: t + b * beat }; this.voice(t, m, b * beat); t += b * beat; return n; });
    this.songEnd = t;
    this.lastIdx = -1;
    this.setState({ singing: true, ended: false });
    const tick = () => {
      const now = c.currentTime;
      let s = 0.1, idx = -1;
      for (let i = 0; i < this.sched.length; i++) {
        const n = this.sched[i];
        if (now >= n.s && now < n.e) {
          idx = i;
          const p = (now - n.s) / (n.e - n.s);
          const open = p < 0.12 ? p / 0.12 : p > 0.82 ? Math.max(0, (0.94 - p) / 0.12) : 1;
          s = 0.1 + 0.9 * open * (0.75 + 0.25 * Math.sin(now * 30)) * (0.7 + (n.m - 67) / 40);
          break;
        }
      }
      s = Math.min(1.15, Math.max(0.1, s));
      if (this.cavityRef.current) this.cavityRef.current.setAttribute('transform', `translate(0 140) scale(1 ${s.toFixed(3)}) translate(0 -140)`);
      if (this.jawRef.current) this.jawRef.current.setAttribute('transform', `translate(0 ${(s * 30 - 3).toFixed(2)})`);
      if (idx !== -1 && idx !== this.lastIdx) { this.lastIdx = idx; this.spawnNote(); }
      if (now < this.songEnd + 0.2) this.raf = requestAnimationFrame(tick);
      else this.setState({ singing: false, ended: true });
    };
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(tick);
  }

  addFx(items, life) {
    this.setState(st => ({ fx: [...st.fx, ...items] }));
    const ids = new Set(items.map(i => i.key));
    (this.timers ||= []).push(setTimeout(() => this.setState(st => ({ fx: st.fx.filter(el => !ids.has(el.key)) })), life));
  }

  spawnNote() {
    const stage = this.stageRef.current, m = this.mouthRef.current;
    let x = 200, y = 250;
    if (stage && m) {
      const a = stage.getBoundingClientRect(), b = m.getBoundingClientRect(), k = this.state.scale || 1;
      x = (b.left - a.left) / k; y = (b.top - a.top) / k;
    }
    const glyphs = ['♪', '♫', '♩', '♬'];
    const colors = ['var(--color-accent-2-600)', 'var(--color-accent-600)', 'var(--color-accent-2-700)'];
    const id = ++this.fxId;
    const el = React.createElement('div', {
      key: 'n' + id,
      style: { position: 'absolute', left: x - 20, top: y - 30, fontFamily: 'var(--font-heading)', fontSize: 34 + Math.random() * 18, color: colors[id % 3], textShadow: '2px 2px 0 var(--color-neutral-100)', '--dx': (-60 - Math.random() * 120) + 'px', animation: 'noteFloat 2.4s ease-out forwards' }
    }, glyphs[id % 4]);
    this.addFx([el], 2500);
  }

  burstConfetti() {
    const colors = ['var(--color-accent-500)', 'var(--color-accent-300)', 'var(--color-accent-2-500)', 'var(--color-accent-2-300)', 'var(--color-neutral-100)', 'var(--color-accent-700)'];
    const items = Array.from({ length: 46 }, (_, i) => React.createElement('div', {
      key: 'c' + (++this.fxId),
      style: { position: 'absolute', left: Math.random() * 760, top: -20, width: 8 + Math.random() * 8, height: 6 + Math.random() * 10, borderRadius: i % 3 ? 3 : 999, background: colors[i % colors.length], '--dx': (Math.random() * 160 - 80) + 'px', '--rot': (Math.random() * 900 - 450) + 'deg', animation: `confettiFall ${2.6 + Math.random() * 1.8}s cubic-bezier(.3,.1,.6,1) ${0.6 + Math.random() * 1.2}s both` }
    }));
    this.addFx(items, 6000);
  }

  renderVals() {
    const o = this.state.opened, k = this.state.scale;
    const up = (deg) => o ? `rotateX(${deg}deg)` : 'rotateX(0deg)';
    return {
      stageRef: this.stageRef, jawRef: this.jawRef, cavityRef: this.cavityRef, mouthRef: this.mouthRef,
      scale: k, boxW: Math.round(760 * k), boxH: Math.round(640 * k),
      floorT: o ? 'rotateX(56deg) translateZ(0)' : 'rotateX(34deg) rotateZ(-5deg) translateY(-60px)',
      panelT: o ? 'translateZ(1px) rotateX(-96deg)' : 'translateZ(1px) rotateX(-180deg)',
      balloonsT: up(-80), fishT: up(-66), wavesT: up(-58), letteringT: up(-62), presentsT: up(-56),
      popOpacity: o ? 1 : 0, coverOpacity: o ? 0 : 1, insideOpacity: o ? 1 : 0,
      cursor: o ? 'default' : 'pointer',
      bobAnim: this.state.singing ? 'fishBob 0.88s ease-in-out infinite' : 'none',
      fx: this.state.fx,
      open: this.open, replay: this.replay,
      showHint: !o, showReplay: o && this.state.ended,
    };
  }
}
